name: Publish to GitHub Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # ── Job 1: push → main → only auto-tag ──────────────────────
  tag:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Auto-tag from package.json
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if ! git tag -l "$VERSION" | grep -q .; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git tag "$VERSION"
            git push origin "$VERSION"
            echo "✅ Created and pushed tag $VERSION"
          else
            echo "⏭️  Tag $VERSION already exists — version not bumped"
          fi

  # ── Job 2: push → tag v* → only publish ─────────────────────
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@vbirukov'

      - name: Install dependencies
        run: npm ci

      - name: Verify package version matches tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag $GITHUB_REF_NAME does not match package.json $PKG_VERSION"
            exit 1
          fi

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}